<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>roriru kureru</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            color: #cdd3cd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-shadow: 0 0 5px #505050;

            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.05),
                    rgba(0, 255, 0, 0.05) 2px,
                    transparent 2px,
                    transparent 4px
                ),
                #150015;
            background-attachment: fixed;
        }

        .contenedorPrincipal {
            background: #111;
            border: 4px solid #072c00;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.4rem;
            text-align: center;
            color: #cdd3cd;
        }

        .subtitulo {
            text-align: center;
            font-size: 0.8rem;
            color: #82d2be;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .menu a {
            background-color: #111;
            border: 2px solid #82d2be;
            padding: 10px 15px;
            color: #5ae3bc;
            text-decoration: none;
            transition: all 0.3s;
            margin: 5px;
        }

        .menu a:hover {
            background-color: #82d2be;
            color: #111;
            text-shadow: none;
        }

        .proyecto {
            background-color: #1a1a1a;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px dashed #82d2be;
        }

        .proyecto h2 {
            color: #c50091;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 40px;
            color: #888;
        }

        a.enlaceFinal {
            color: #82d2be;
        }

        strong.tipoP {
            color: #8d8d8d;
        }

        @media (max-width: 600px) {
            .menu {
                flex-direction: column;
                align-items: center;
            }

            .menu a {
                margin: 10px 0;
            }

            .contenedorPrincipal {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="contenedorPrincipal">
        <header>
            <h1>roriru kureru</h1>
            <p class="subtitulo">ROKU - ROKU - ROKU </p>
        </header>

        <!--

            <a href="">Web</a>
        </nav> -->

            <h2>roku - ES</h2>

            <p>
            

            </p>
            <p><strong class="tipoP"> </strong> </p>
            <p><strong class="tipoP"> </strong>  </p>
            <p><strong class="tipoP"> </strong> </p>
        </section>

        <section class="proyecto" id="proyecto2">
            <h2>roku - EN</h2>

            <p></p>
            <p><strong class="tipoP"> </strong> </p>
            <p><strong class="tipoP"> </strong>  </p>

        </section>


        <footer>
            <p>
                Rider: <a class="enlaceFinal" href="">roku-rider</a>
            </p>
        </footer>
    </main>
</body>
</html>
