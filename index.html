    <style>
        body {

        .barraNavegacion {

        }

        .rokuPerfil img {

            object-fit: cover;
            width: 180px;
            height: 180px;
        }

        .rokuPerfil h1 {
            font-size: 1.4rem;
            color: #cdd3cd;
            margin: 0;
            text-align: center;
        }

        .links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;

        .links a {
            background-color: #111;
            border: 2px solid #072c00;
            padding: 10px 18px;

        }

        .links a:hover {

        footer {
            background-color: rgba(17, 17, 17, 0.95);
            border-top: 2px solid #072c00;

        }

        footer p {

        .btnPlayDemo {
            background-color: #111;
            border: 2px solid #072c00;
            color: #5ae3bc;
            width: 22px;
            height: 22px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.6rem;
            transition: all 0.2s;
        }

        .btnPlayDemo:hover {
            background-color: #82d2be;
            color: #111;
        }

        @media (max-width: 600px) {

            .links a {

                font-size: 0.8rem;
                flex: 1;
            }

            footer {
                text-align: center;
                font-size: 0.6rem;
                margin-top: 40px;

<body>

    <header class="barraNavegacion">
        <nav>
            <a href="index.html">Inicio</a>

            <a href="miscosis.html">rorirukureru</a>

        </nav>
    </header>


    <content class="contenedorPrincipal">
        <section class="rokuPerfil">
            <img src="img/flor_blanca.png" alt="logoRoriruKureru" />
            <h1>roriru kureru</h1>
        </section>

        <nav class="links">
            <a href="contacto.html">contactame</a>
            <a href="rorirukureru.html">¿roriru kureru?</a>
            <a href="miscosis.html">roriru kureru</a>
        </nav>
    </content>

    <footer>

        <p>
            <audio id="audioFondo" src="sounds/enLap4r3d_DEMO.wav" preload="auto" autoplay>Estas oyendo una EnLaPared -
                RokuDEMO</audio>
            Estás oyendo una EnLaPared - RokuDEMO
        </p>

        <button id="btnPlayDemo" class="btnPlayDemo" title="Volver a reproducir">▶</button>

    </footer>

   <script>
    const audio = document.getElementById('audioFondo');
    const btnPlay = document.getElementById('btnPlayDemo');

    const tiempoGuardado = sessionStorage.getItem('audioTiempo');
    if (tiempoGuardado) {
        audio.currentTime = parseFloat(tiempoGuardado);
    }

    const intentoPlay = audio.play();
    
    if (intentoPlay !== undefined) {
        intentoPlay.catch(error => {
            console.log("Autoplay bloqueado. Esperando interacción del usuario...");
            
            const activarConInteraccion = () => {
                audio.play();
                document.removeEventListener('click', activarConInteraccion);
                document.removeEventListener('keydown', activarConInteraccion);
            };

            document.addEventListener('click', activarConInteraccion);
            document.addEventListener('keydown', activarConInteraccion);
        });
    }

    btnPlay.addEventListener('click', (e) => {
        e.stopPropagation(); 
        audio.currentTime = 0;
        audio.play();
    });

    window.addEventListener('beforeunload', () => {
        sessionStorage.setItem('audioTiempo', audio.currentTime);
    });
</script>
</body>

</html>
